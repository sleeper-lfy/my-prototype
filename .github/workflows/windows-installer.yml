name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-installer.yml'
      - 'packaging/**'
      - 'scripts/**'
      - 'server/**'
      - 'src/**'
      - 'public/**'
      - 'examples/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'index.html'

permissions:
  contents: read

jobs:
  install-and-run:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies and validate source
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "STUDIO_RELEASE_DIR=releases/v$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Frontend build failed' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
      - name: Prepare NSIS
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'
          if (-not (Test-Path $compiler)) {
            choco install nsis --yes --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          }
          if (-not (Test-Path $compiler)) { throw 'NSIS compiler not found' }
          "MAKENSIS_BIN=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "STUDIO_BUILD_DIR=$env:RUNNER_TEMP/game-ui-studio-build" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify UI import and both languages in real Chromium
        run: |
          python -m pip install playwright
          if ($LASTEXITCODE -ne 0) { throw 'Browser test dependency installation failed' }
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Chromium installation failed' }
          python scripts/import-language-smoke.py --screenshots --out artifacts/v0.3.0/import-language-results.json --preview-dir previews/v0.3.0
          if ($LASTEXITCODE -ne 0) { throw 'UI import and language acceptance failed' }
          python scripts/map-workspace-smoke.py --out artifacts/v0.3.0/map-regression --previews previews/v0.3.0/map-regression
          if ($LASTEXITCODE -ne 0) { throw 'Map workspace and Codex task acceptance failed' }
          python scripts/alignment-smoke.py --out artifacts/v0.3.0/alignment --previews previews/v0.3.0/alignment
          if ($LASTEXITCODE -ne 0) { throw 'Alignment and snap-guide acceptance failed' }
          python scripts/studio-features-smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Project toolbox acceptance failed' }
          python scripts/animation-smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Pixel animation acceptance failed' }
      - name: Build the self-contained Windows installer
        run: |
          npm run package:windows
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
      - name: Install, launch, save, upgrade and uninstall on Windows
        run: ./scripts/test-windows-install.ps1
      - name: Keep installer and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-ui-studio-windows-x64
          if-no-files-found: warn
          path: |
            ${{ env.STUDIO_RELEASE_DIR }}/Game-UI-Studio-Setup-*-x64.exe
            ${{ env.STUDIO_RELEASE_DIR }}/*.sha256
            ${{ env.STUDIO_RELEASE_DIR }}/windows-*.json
            ${{ env.STUDIO_RELEASE_DIR }}/SHA256SUMS*
            artifacts/windows-installer-native.json
            artifacts/windows-installer-logs/
            artifacts/v0.3.0/import-language-results.json
            artifacts/v0.3.0/browser/
            artifacts/v0.3.0/map-regression/
            artifacts/v0.3.0/alignment/
            artifacts/v0.3.0/godot-update/
            previews/v0.3.0/*.png
            artifacts/v0.4.0/
            previews/v0.4.0/
